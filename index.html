<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>TPL Season 2 – Player Registration</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{color-scheme:light;--bg:#fbf6e8;--card:#fff;--tx:#1d1a12;--mu:#6f6850;--ac:#c8102e;--bd:#e6dcc0}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f7e9b8 0,#fffaf0 280px);min-height:100vh;color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
.w{max-width:560px;margin:0 auto}
.hd{display:flex;align-items:center;gap:14px;background:#000;border:2px solid #f5c518;border-radius:16px;padding:10px 16px 10px 10px;margin-bottom:14px}.hd img{width:92px;height:92px;border-radius:12px;flex:none}.hd .t{color:#f5c518;font-size:20px;font-weight:800}.hd .u{color:#e8e0c8;font-size:14px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;box-shadow:0 4px 18px rgba(120,90,10,.12)}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input[type=text],input[type=tel]{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
.cat{display:flex;gap:8px;flex-wrap:wrap}.cat label{margin:0;font-weight:500;flex:1;min-width:110px;border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:center;cursor:pointer}
.cat input{display:none}.cat input:checked+span{color:var(--ac);font-weight:700}.cat label:has(input:checked){border-color:var(--ac);background:rgba(200,16,46,.08)}
.ph{display:flex;align-items:center;gap:14px}.pv{width:84px;height:84px;border-radius:50%;background:var(--bg);border:2px dashed var(--bd);object-fit:cover;flex:none}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:600;cursor:pointer;width:100%;margin-top:20px}button:disabled{opacity:.6}
.msg{margin-top:12px;font-size:15px}.err{color:#c0392b}.ok{color:#1b7a3d;font-weight:600}
</style></head><body><div class="w">

<div class="card">
<label for="nm">Player Name</label><input id="nm" type="text" maxlength="60" placeholder="Full name">
<label for="mb">Mobile Number</label><input id="mb" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number">
<label for="vl">Village</label><input id="vl" type="text" maxlength="60" placeholder="Village name">

<script>
// 👇 Paste your Google Apps Script Web App URL here (see setup steps)
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbywyyIvabOoTi7KmOKEaqdywI4Aaokvst06-5OuhahOBvqDsetoXBcOHRvhm-n9eBVZ/exec";

const $=id=>document.getElementById(id);let photo="";
const setMsg=(t,c)=>{$("msg").textContent=t;$("msg").className="msg "+(c||"")};
function compress(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const i=new Image();i.onerror=rej;i.onload=()=>{const m=480,s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.8))};i.src=r.result};r.readAsDataURL(file)})}
$("ph").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{photo=await compress(f);$("pv").src=photo}catch(x){setMsg("Could not read this photo.","err")}};
$("go").onclick=async()=>{
 const name=$("nm").value.trim(),mobile=$("mb").value.trim(),village=$("vl").value.trim(),c=document.querySelector('input[name=cat]:checked');
 if(!name||!village)return setMsg("Please enter name and village.","err");
 if(!/^[6-9]\d{9}$/.test(mobile))return setMsg("Enter a valid 10-digit mobile number.","err");
 if(!c)return setMsg("Please select a category.","err");
 if(!photo)return setMsg("Please add a player photo.","err");
 if(SCRIPT_URL.startsWith("PASTE"))return setMsg("Setup incomplete: add the Web App URL in index.html","err");
 $("go").disabled=true;setMsg("Saving… please wait");
 try{
  const r=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({name,mobile,village,category:c.value,photo})});
  const j=await r.json();
  if(j.ok){setMsg("✅ "+name+" registered successfully!","ok");$("nm").value=$("mb").value=$("vl").value="";c.checked=false;photo="";$("pv").removeAttribute("src");$("ph").value=""}
  else setMsg(j.error||"Could not save. Try again.","err");
 }catch(e){setMsg("Network error. Please try again.","err")}
 $("go").disabled=false};
</script></body></html>
